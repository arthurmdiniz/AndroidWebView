name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AndroidWebView
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug
        run: ./gradlew :app:assembleDebug

      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: AndroidWebView/app/build/reports/tests/
          if-no-files-found: ignore

      - name: APK debug
        uses: actions/upload-artifact@v4
        with:
          name: webview-nativo-debug
          path: AndroidWebView/app/build/outputs/apk/debug/app-debug.apk
