name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AndroidWebView
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários
        run: ./gradlew :app:testDebugUnitTest

      - name: Decodificar keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Sem keystore configurado: o APK de release sairá sem assinatura."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Publicar release no GitHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Webview-Nativo-$TAG.apk"
          gh release create "$TAG" "$RUNNER_TEMP/Webview-Nativo-$TAG.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes

      - name: APK release (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: webview-nativo-release
          path: AndroidWebView/app/build/outputs/apk/release/app-release.apk
