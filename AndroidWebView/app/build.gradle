plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dms.webview'
    compileSdk 34

    defaultConfig {
        applicationId "com.dms.webview"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
        buildConfigField "String", "BUILD_TIME", "\"${new Date().format('ddMMyyyy.HHmm', TimeZone.getTimeZone('America/Sao_Paulo'))}\""
    }

    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    testImplementation 'junit:junit:4.13.2'
}

task publishApk(type: Copy) {
    from "$buildDir/outputs/apk/debug/app-debug.apk"
    into "$rootDir/../publish"
    rename 'app-debug.apk', 'Webview-Nativo.apk'
}

task publishReleaseApk(type: Copy) {
    from "$buildDir/outputs/apk/release/app-release.apk"
    into "$rootDir/../publish"
    rename 'app-release.apk', 'Webview-Nativo.apk'
}

afterEvaluate {
    tasks.matching { it.name.startsWith('assemble') }.configureEach { task ->
        task.finalizedBy tasks.matching { it.name == 'publishApk' || it.name == 'publishReleaseApk' }
    }
}
